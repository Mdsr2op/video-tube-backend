# Cloud Build pipeline for video-tube-backend (CI side of GitOps).
#
# Trigger: push to branch `my-branch`.
# Flow:
#   1. Build the Docker image, tagged with the short commit SHA.
#   2. Push it to Artifact Registry.
#   3. Clone the env repo, update the deployment manifest with the
#      new image tag, and push the change back to the env repo.
#   4. The env repo's own trigger then picks up that push and rolls
#      the change out to GKE — that's the "GitOps" part.
#
# Substitutions you'll set on the trigger:
#   _AR_REGION   = asia-south1
#   _AR_REPO     = video-tube
#   _IMAGE_NAME  = video-tube-backend
#   _ENV_REPO    = github.com/Mdsr2op/video-tube-env
#   _ENV_BRANCH  = main
#
# Secret you'll wire in (Secret Manager):
#   GITHUB_PAT — a fine-grained PAT with content:write on the env repo,
#   so Cloud Build can push back the manifest update.

substitutions:
  _AR_REGION: asia-south1
  _AR_REPO: video-tube
  _IMAGE_NAME: video-tube-backend
  _ENV_REPO: github.com/Mdsr2op/video-tube-env
  _ENV_BRANCH: main

# Tell Cloud Build to mount the GitHub PAT from Secret Manager
# as an env var named GITHUB_PAT inside the steps that need it.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-pat/versions/latest
      env: GITHUB_PAT

steps:
  # ---- Step 1: Build the Docker image ----
  # Tag with both the commit SHA (immutable, traceable) and 'latest'
  # (convenient for humans). The SHA tag is what the manifest will
  # actually reference — never deploy 'latest' from a pipeline.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA
      - -t
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest
      - .

  # ---- Step 2: Push both tags to Artifact Registry ----
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}

  # ---- Step 3: Update the env repo with the new image tag ----
  # We clone the env repo, run sed to swap the image tag in the
  # deployment manifest, commit, and push. The env repo's trigger
  # then takes over.
  - id: update-env-repo
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    secretEnv: ['GITHUB_PAT']
    args:
      - -c
      - |
        set -euo pipefail

        # Configure git identity for the bot commit.
        git config --global user.email "cloudbuild@${PROJECT_ID}.iam.gserviceaccount.com"
        git config --global user.name "Cloud Build Bot"

        # Clone using the PAT for auth. The token is in the URL only
        # for this single command; it never lands on disk in a config.
        git clone --depth 1 --branch ${_ENV_BRANCH} \
          https://x-access-token:$$GITHUB_PAT@${_ENV_REPO}.git env-repo

        cd env-repo

        # Swap the image tag inside the Deployment manifest.
        # The manifest uses a placeholder line:
        #   image: <AR_REGION>-docker.pkg.dev/<PROJECT_ID>/<REPO>/<IMAGE>:TAG
        # We replace whatever tag is there with the new $SHORT_SHA.
        NEW_IMAGE="${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}"
        sed -i -E "s|image: ${_AR_REGION}-docker\.pkg\.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:[^[:space:]]+|image: $$NEW_IMAGE|g" k8s/deployment.yaml

        # If sed produced no diff, exit cleanly — nothing to commit.
        if git diff --quiet; then
          echo "No image tag change detected, skipping commit."
          exit 0
        fi

        git add k8s/deployment.yaml
        git commit -m "ci: update image to ${SHORT_SHA}"
        git push origin ${_ENV_BRANCH}

# Use a small build VM — we don't need the default high-CPU one,
# and it'd burn credits faster.
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

# Record the built image so it shows up in the Cloud Build UI.
images:
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest

timeout: 1200s
